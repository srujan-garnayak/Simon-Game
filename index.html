<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <h2>
            Simon Game
        </h2>
        <div class="container">
            <div class="color-box">
                <div class="red"></div>
                <div class="blue"></div>
            </div>
            <div class="color-box">
                <div class="green"></div>
                <div class="yellow"></div>
            </div>
            <div class="counting">
                <div class="level">Level : 0</div>
                <button class="start">Start</button>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
